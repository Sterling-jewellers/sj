<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042241"/>
      <stop offset="60%" stop-color="#0a3560"/>
      <stop offset="100%" stop-color="#021830"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#E8C96A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#042241" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1800" height="1100" fill="url(#bg1)"/>

  <!-- Subtle texture dots -->
  <rect width="1800" height="1100" fill="url(#glow)"/>

  <!-- Decorative geometric frame — thin gold lines -->
  <!-- Outer frame -->
  <rect x="80" y="60" width="1640" height="980" fill="none" stroke="#C9A84C" stroke-width="0.6" stroke-opacity="0.3"/>
  <!-- Inner frame -->
  <rect x="110" y="90" width="1580" height="920" fill="none" stroke="#C9A84C" stroke-width="0.3" stroke-opacity="0.15"/>

  <!-- Corner ornaments -->
  <!-- TL -->
  <path d="M80,100 L80,60 L120,60" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- TR -->
  <path d="M1680,60 L1720,60 L1720,100" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- BL -->
  <path d="M80,1000 L80,1040 L120,1040" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- BR -->
  <path d="M1680,1040 L1720,1040 L1720,1000" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Central diamond ring illustration (geometric) -->
  <!-- Ring band -->
  <ellipse cx="900" cy="480" rx="140" ry="40" fill="none" stroke="url(#gold1)" stroke-width="18" stroke-opacity="0.9"/>
  <!-- Ring top curve -->
  <path d="M760,480 Q900,300 1040,480" fill="none" stroke="url(#gold1)" stroke-width="18" stroke-opacity="0.9"/>
  <!-- Diamond shape on ring -->
  <polygon points="900,260 940,310 900,380 860,310" fill="none" stroke="url(#gold1)" stroke-width="2" stroke-opacity="0.8"/>
  <polygon points="900,270 930,310 900,370 870,310" fill="#C9A84C" fill-opacity="0.12"/>
  <!-- Diamond facets -->
  <line x1="900" y1="260" x2="900" y2="380" stroke="#E8C96A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="860" y1="310" x2="940" y2="310" stroke="#E8C96A" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Sparkle lines -->
  <line x1="900" y1="220" x2="900" y2="240" stroke="#E8C96A" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="860" y1="235" x2="870" y2="252" stroke="#E8C96A" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="940" y1="235" x2="930" y2="252" stroke="#E8C96A" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="900" cy="214" r="2.5" fill="#E8C96A" fill-opacity="0.8"/>
  <circle cx="855" cy="228" r="1.8" fill="#E8C96A" fill-opacity="0.6"/>
  <circle cx="945" cy="228" r="1.8" fill="#E8C96A" fill-opacity="0.6"/>

  <!-- Thin horizontal rule above text -->
  <line x1="820" y1="580" x2="980" y2="580" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Eyebrow text placeholder area -->
  <!-- (text is rendered by React) -->

  <!-- Thin rule below heading area -->
  <line x1="840" y1="760" x2="960" y2="760" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Sterling Jewellers wordmark area — bottom -->
  <text x="900" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#C9A84C" fill-opacity="0.35" letter-spacing="8">STERLING JEWELLERS · LONDON</text>

  <!-- Decorative side elements -->
  <!-- Left vertical ornament -->
  <line x1="200" y1="200" x2="200" y2="900" stroke="#C9A84C" stroke-width="0.4" stroke-opacity="0.12"/>
  <circle cx="200" cy="200" r="3" fill="none" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="200" cy="900" r="3" fill="none" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- Right vertical ornament -->
  <line x1="1600" y1="200" x2="1600" y2="900" stroke="#C9A84C" stroke-width="0.4" stroke-opacity="0.12"/>
  <circle cx="1600" cy="200" r="3" fill="none" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="1600" cy="900" r="3" fill="none" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.3"/>
</svg>
