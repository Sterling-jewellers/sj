<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" width="1800" height="1100">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="45%" stop-color="#2a1e0a"/>
      <stop offset="100%" stop-color="#120d05"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A07830"/>
      <stop offset="40%" stop-color="#E8C96A"/>
      <stop offset="70%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg3)"/>
  <rect width="1800" height="1100" fill="url(#warmGlow)"/>

  <!-- Decorative border -->
  <rect x="70" y="55" width="1660" height="990" fill="none" stroke="url(#gold3)" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Corner ornaments with flourish -->
  <!-- TL -->
  <path d="M70,120 L70,55 L135,55" fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-opacity="0.7"/>
  <circle cx="70" cy="55" r="3" fill="#C9A84C" fill-opacity="0.5"/>
  <!-- TR -->
  <path d="M1665,55 L1730,55 L1730,120" fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-opacity="0.7"/>
  <circle cx="1730" cy="55" r="3" fill="#C9A84C" fill-opacity="0.5"/>
  <!-- BL -->
  <path d="M70,925 L70,1045 L135,1045" fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-opacity="0.7"/>
  <circle cx="70" cy="1045" r="3" fill="#C9A84C" fill-opacity="0.5"/>
  <!-- BR -->
  <path d="M1665,1045 L1730,1045 L1730,925" fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-opacity="0.7"/>
  <circle cx="1730" cy="1045" r="3" fill="#C9A84C" fill-opacity="0.5"/>

  <!-- Two interlinked wedding bands (central illustration) -->
  <!-- Left band -->
  <ellipse cx="840" cy="440" rx="120" ry="34" fill="none" stroke="url(#gold3)" stroke-width="22" stroke-opacity="0.95"/>
  <!-- Left band top arch -->
  <path d="M720,440 Q840,280 960,440" fill="none" stroke="url(#gold3)" stroke-width="22" stroke-opacity="0.95"/>
  <!-- Right band (offset, interlinked) -->
  <ellipse cx="960" cy="440" rx="120" ry="34" fill="none" stroke="#C9A84C" stroke-width="22" stroke-opacity="0.85"/>
  <!-- Right band top arch (slightly lighter) -->
  <path d="M840,440 Q960,280 1080,440" fill="none" stroke="#C9A84C" stroke-width="22" stroke-opacity="0.85"/>

  <!-- Overlap highlight to show interlink -->
  <path d="M900,408 Q930,390 960,408" fill="none" stroke="#E8C96A" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Thin horizontal dividers -->
  <line x1="700" y1="530" x2="1100" y2="530" stroke="#C9A84C" stroke-width="0.6" stroke-opacity="0.3"/>
  <line x1="770" y1="535" x2="1030" y2="535" stroke="#C9A84C" stroke-width="0.3" stroke-opacity="0.2"/>

  <!-- Decorative dot row -->
  <circle cx="840" cy="560" r="1.5" fill="#C9A84C" fill-opacity="0.4"/>
  <circle cx="870" cy="560" r="1.5" fill="#C9A84C" fill-opacity="0.4"/>
  <circle cx="900" cy="560" r="2.5" fill="#C9A84C" fill-opacity="0.7"/>
  <circle cx="930" cy="560" r="1.5" fill="#C9A84C" fill-opacity="0.4"/>
  <circle cx="960" cy="560" r="1.5" fill="#C9A84C" fill-opacity="0.4"/>

  <!-- Bottom rule -->
  <line x1="820" y1="830" x2="980" y2="830" stroke="#C9A84C" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Engraved-style text hint -->
  <text x="900" y="1010" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#C9A84C" fill-opacity="0.28" letter-spacing="8">STERLING JEWELLERS · CRAFTED IN LONDON</text>

  <!-- Side flourishes -->
  <path d="M160,350 Q200,380 160,420 Q200,460 160,500" fill="none" stroke="#C9A84C" stroke-width="0.6" stroke-opacity="0.2"/>
  <path d="M1640,350 Q1600,380 1640,420 Q1600,460 1640,500" fill="none" stroke="#C9A84C" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
